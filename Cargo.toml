[package]
name = "levi-runner"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["3d", "ui", "web", "bevy_audio", "wav"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
# ponytail: 3 = velocidade (wasm um pouco maior); volte a "s" se o download pesar mais que o FPS
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
