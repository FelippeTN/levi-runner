<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Levi Runner</title>
<link rel="icon" href="data:,">
</head>
<body>
<canvas id="game" tabindex="0"></canvas>

<div id="hud">
  <!-- pausa (canto superior esquerdo) -->
  <button id="pause" class="blue-button" data-show="playing paused" aria-label="Pausar"><i></i><i></i></button>

  <!-- pontos e moedas empilhados no canto superior direito -->
  <div class="stats">
    <div class="plate" data-show="playing paused"><span id="score" class="score"></span></div>
    <div class="plate"><span id="coins" class="coins">0</span><span class="coin-icon"></span></div>
  </div>

  <!-- início / fim de jogo: selo do título no alto, "toque para jogar" embaixo (o Levi fica no meio) -->
  <div class="menu" data-show="menu">
    <div class="badge">
      <div class="bubbles">
        <b style="width:30%;left:6%;top:26%"></b>
        <b style="width:28%;left:64%;top:18%"></b>
        <b style="width:18%;left:0;top:8%"></b>
        <b style="width:16%;left:82%;top:4%"></b>
        <b style="width:20%;left:20%;top:58%"></b>
        <b style="width:16%;left:66%;top:66%"></b>
        <b style="width:46%;left:27%;top:0"></b>
        <h1 id="title"></h1>
      </div>
      <p id="banner" class="banner"></p>
    </div>
    <p id="cta" class="cta"></p>
  </div>

  <div class="paused" data-show="paused">
    <h2>PAUSA</h2>
    <p>Esc ou toque no botão para continuar</p>
  </div>

  <!-- som (canto inferior direito) e dicas (inferior esquerdo) nos menus -->
  <button id="sound" class="blue-button" data-show="menu paused"></button>
  <p class="plate hint" data-show="menu paused">Espaço ou toque: jogar
← → trocar de faixa   ↑ pular   ↓ rolar
Esc pausa   M som</p>

  <p id="zone" class="zone"></p>
</div>

<div id="loading">Carregando o Levi…</div>

<div id="login" hidden>
  <form>
    <h1>Levi Runner</h1>
    <input name="usuario" placeholder="Usuário (escolha um no 1º acesso)" autocomplete="username" required>
    <input name="senha" type="password" placeholder="Senha (mín. 4)" minlength="4" autocomplete="current-password" required>
    <p id="login-erro" role="alert"></p>
    <button>Entrar</button>
  </form>
</div>
<aside id="ranking" hidden><h2>RANKING</h2><ol></ol><p></p></aside>

<script type="module" src="/src/main.js"></script>
</body>
</html>
