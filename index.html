<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Levi Runner</title>
<link rel="icon" href="data:,">
</head>
<body>
<canvas id="game" tabindex="0"></canvas>

<div id="hud">
  <!-- pausa (canto superior esquerdo) -->
  <button id="pause" class="blue-button" data-show="playing paused" aria-label="Pausar"><i></i><i></i></button>

  <!-- pontos e carteira empilhados no canto superior direito -->
  <div class="stats" data-show="playing paused">
    <div class="plate"><span id="score" class="score"></span></div>
    <div class="plate"><span id="cash" class="coins">R$ 0</span><span class="coin-icon"></span></div>
    <div class="pots">
      <span id="reserve" class="pot pot-reserve" hidden></span>
      <span id="invested" class="pot pot-invest" hidden></span>
      <span id="debt" class="pot pot-debt" hidden></span>
    </div>
  </div>

  <!-- dinheiro entrando e saindo -->
  <div id="floaters" aria-live="polite"></div>

  <!-- início / fim de jogo: selo do título no alto, extrato e navegação embaixo (o Levi fica no meio) -->
  <div class="menu" data-show="menu">
    <div class="top">
      <!-- logo: Pão de Açúcar com bondinho, nome e a onda do calçadão de Copacabana -->
      <div class="badge">
        <svg class="skyline" viewBox="0 0 240 64" aria-hidden="true">
          <circle class="sun" cx="204" cy="18" r="10"/>
          <path class="hill" d="M0 64 L0 58 C18 56 34 40 58 36 C78 34 90 46 100 50 C112 38 126 12 140 7 C152 3 160 6 166 14 C178 30 196 52 240 60 L240 64 Z"/>
          <path class="cable" d="M58 36 L146 6 M102.5 21 V23"/>
          <rect class="car" x="98" y="23" width="9" height="6" rx="1.5"/>
        </svg>
        <h1 id="title">LEVI RUNNER</h1>
        <svg class="calcadao" viewBox="0 0 240 12" preserveAspectRatio="none" aria-hidden="true"><path d="M0 6 q6 -6 12 0 q6 6 12 0 q6 -6 12 0 q6 6 12 0 q6 -6 12 0 q6 6 12 0 q6 -6 12 0 q6 6 12 0 q6 -6 12 0 q6 6 12 0 q6 -6 12 0 q6 6 12 0 q6 -6 12 0 q6 6 12 0 q6 -6 12 0 q6 6 12 0 q6 -6 12 0 q6 6 12 0 q6 -6 12 0 q6 6 12 0"/></svg>
        <p id="banner" class="banner">RIO DE JANEIRO</p>
      </div>
      <button id="goal" class="goal" hidden></button>
    </div>

    <section id="statement" class="statement" hidden>
      <h2>EXTRATO DA CORRIDA</h2>
      <dl id="statement-rows"></dl>
      <p id="statement-deposit" class="deposit"></p>
      <p id="tip" class="tip"></p>
    </section>

    <nav class="menu-nav">
      <button id="open-bank" class="blue-button nav-button"><i aria-hidden="true">🏦</i>BANCO</button>
      <button id="play" class="play-button"><i class="play-icon" aria-hidden="true"></i>JOGAR</button>
      <button id="open-shop" class="blue-button nav-button"><i aria-hidden="true">🛒</i>LOJA</button>
    </nav>
  </div>

  <div class="paused" data-show="paused">
    <h2>PAUSA</h2>
    <p>Esc ou toque no botão para continuar</p>
  </div>

  <!-- som (canto inferior direito) e dicas (inferior esquerdo) nos menus -->
  <button id="sound" class="blue-button" data-show="menu paused"></button>
  <p class="plate hint" data-show="menu paused">Espaço ou toque: jogar
← → trocar de faixa   ↑ pular   ↓ rolar
Esc pausa   M som</p>

  <p id="zone" class="zone"></p>
</div>

<!-- painéis do menu: Banco e Loja -->
<div id="backdrop" class="backdrop" hidden></div>

<section id="bank" class="sheet" hidden aria-labelledby="bank-title">
  <header><h2 id="bank-title">BANCO DO LEVI</h2><span id="bank-month" class="month"></span><button class="close" data-close aria-label="Fechar">✕</button></header>
  <div class="sheet-body" id="bank-body"></div>
</section>

<section id="shop" class="sheet" hidden aria-labelledby="shop-title">
  <header><h2 id="shop-title">LOJA DO LEVI</h2><span id="shop-balance" class="month"></span><button class="close" data-close aria-label="Fechar">✕</button></header>
  <div class="sheet-body" id="shop-body"></div>
</section>

<div id="loading">Carregando o Levi…</div>

<div id="login" hidden>
  <form>
    <h1>Levi Runner</h1>
    <input name="usuario" placeholder="Usuário (escolha um no 1º acesso)" autocomplete="username" required>
    <input name="senha" type="password" placeholder="Senha (mín. 4)" minlength="4" autocomplete="current-password" required>
    <p id="login-erro" role="alert"></p>
    <button>Entrar</button>
  </form>
</div>
<aside id="ranking" hidden><h2>RANKING</h2><ol></ol><p></p></aside>

<script type="module" src="/src/main.js"></script>
</body>
</html>
